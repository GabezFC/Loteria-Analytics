# Listener LAN (8080): leitura livre; escrita apenas nas rotas de geracao/experimento.
#   0 = leitura (GET/HEAD)   2 = escrita permitida condicionalmente   1 = bloqueada (403)
# Administracao (ex.: POST /api/admin/ingestion) segue exclusiva do loopback (porta 80).
map "$server_port:$request_method:$uri" $cassino_lan_write {
    default 1;
    "~^(?!8080:)" 0;
    "~^8080:(GET|HEAD):" 0;
    "~^8080:POST:/api/(suggestions|experiments)$" 2;
}
# Escrita via LAN exige cabecalho anti-CSRF e Origin identica ao Host (mesma origem).
map "$http_origin|http://$http_host" $cassino_same_origin {
    default 0;
    "~^(.+)\|\1$" 1;
}
map "$cassino_lan_write:$http_x_requested_with:$cassino_same_origin" $cassino_lan_deny {
    default 1;
    "~^0:" 0;
    "2:cassino:1" 0;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DNS interno do Docker: reresolve o backend (o IP do contêiner pode mudar).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Headers de segurança. Nginx não herda add_header se o bloco location
    # definir algum próprio; por isso os locations abaixo usam o include.
    include /etc/nginx/conf.d/security-headers.inc;

    # O Compose LAN encaminha para 8080, sem depender do Host nem do IP pos-NAT.
    if ($cassino_lan_deny) { return 403; }

    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        # Variável força resolução a cada requisição; sem URI em proxy_pass,
        # o caminho original (/api/...) é preservado.
        set $backend_upstream backend:3001;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
