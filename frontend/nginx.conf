map "$server_port:$request_method" $cassino_lan_write {
    default 0;
    "8080:GET" 0;
    "8080:HEAD" 0;
    ~^8080: 1;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DNS interno do Docker: reresolve o backend (o IP do contêiner pode mudar).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Headers de segurança. Nginx não herda add_header se o bloco location
    # definir algum próprio; por isso os locations abaixo usam o include.
    include /etc/nginx/conf.d/security-headers.inc;

    # O Compose LAN encaminha para 8080, sem depender do Host nem do IP pos-NAT.
    if ($cassino_lan_write) { return 403; }

    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        # Variável força resolução a cada requisição; sem URI em proxy_pass,
        # o caminho original (/api/...) é preservado.
        set $backend_upstream backend:3001;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
