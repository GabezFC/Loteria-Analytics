name: launcher-release

on:
  pull_request:
    paths:
      - 'launcher/**'
      - 'installer/**'
      - 'compose.yaml'
      - 'infra/postgres/**'
      - 'infra/portainer/compose.yaml'
      - '.github/workflows/launcher-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Windows package version (X.Y.Z)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Offline tests, WPF publish, installer and checksums
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || '1.0.0' }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          # Use only the hosted image's preinstalled compiler. No download fallback.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          $root = Join-Path $env:RUNNER_TEMP 'cassino-stage15'
          ./launcher/windows/distribution/build.ps1 -Iscc $iscc -Version $env:PACKAGE_VERSION -BuildRoot $root
      # No artifact upload, release, registry push or signing credentials in this workflow.
